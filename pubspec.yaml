name: presensi_app
description: "Aplikasi Presensi SKS - Face Recognition Attendance System"
publish_to: 'none'

version: 2.1.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.18.1

  # HTTP & Storage
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4

  # State Management & Routing
  provider: ^6.1.0
  go_router: ^14.0.0

  # UI - Core
  pin_code_fields: ^8.0.1
  fl_chart: ^0.69.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

  # UI - Baru Fase 1
  google_fonts: ^6.2.1          # Font Montserrat, Inter, JetBrains Mono
  shimmer: ^3.0.0               # Skeleton loading
  lottie: ^3.1.0                # Animasi sukses/gagal presensi
  flutter_animate: ^4.5.0       # Micro-animasi kartu, badge, transisi

  # Camera & GPS
  camera: ^0.10.6
  geolocator: ^11.1.0
  google_mlkit_face_detection: ^0.10.0

  # Firebase
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10

  # File & Share
  path_provider: ^2.1.2
  share_plus: ^9.0.0            # Share kode sesi via WhatsApp/Zoom
  open_filex: ^4.7.0              # Buka file Excel hasil ekspor

  # Notifikasi
  flutter_local_notifications: ^17.2.3  # Tampilkan notifikasi FCM di foreground

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Tambahkan assets untuk Lottie animations dan logo UMS
  assets:
    - assets/animations/
    - assets/images/

  # Font tidak perlu didaftarkan manual karena menggunakan google_fonts